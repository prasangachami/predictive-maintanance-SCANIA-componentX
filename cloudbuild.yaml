# cloudbuild.yaml
# Note: CI/CD runs via GitHub Actions (deploy.yml)
# This file is kept for local testing with: gcloud builds submit

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest
    waitFor:
      - build-image

substitutions:
  _REGION: europe-north1
  _REPO: predictive-maintenance-scania-images
  _SERVICE_NAME: scania-predictive-ml-api

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
