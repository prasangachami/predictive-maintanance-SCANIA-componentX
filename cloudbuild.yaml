steps:
  # Step 0 — Clone the repository
  - name: 'gcr.io/cloud-builders/git'
    id: 'clone-repo'
    args:
      - 'clone'
      - '--branch=deploy/prod'
      - '--depth=1'
      - 'https://github.com/prasangachami/predictive-maintanance-SCANIA-componentX.git'
      - '.'

  # Step 1 — Run tests
  - name: 'python:3.11-slim'
    id: 'run-tests'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install -r requirements.txt --quiet
        pip install pytest httpx pytest-asyncio --quiet
        pytest tests/ -v --tb=short
    waitFor: ['clone-repo']

  # Step 2 — Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    waitFor: ['run-tests']

  # Step 3 — Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}'
    waitFor: ['build-image']

  # Step 4 — Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCS_BUCKET=${_BUCKET},MODEL_VERSION=${_MODEL_VERSION},ACTIVE_MODEL=${_ACTIVE_MODEL}'
    waitFor: ['push-image']

  # Step 5 — Register model in Vertex AI
  - name: 'python:3.11-slim'
    id: 'register-model'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install google-cloud-aiplatform google-cloud-storage --quiet
        python -m src.registry \
          --version ${_MODEL_VERSION} \
          --experiment ${_ACTIVE_MODEL}
    waitFor: ['deploy-cloud-run']

substitutions:
  _REGION:        europe-north1
  _REPO:          predictive-maintenance-scania-images
  _SERVICE_NAME:  scania-predictive-ml-api
  _BUCKET:        predictive-maintenance-scania-artifacts
  _MODEL_VERSION: v1.0.0
  _ACTIVE_MODEL:  exp1

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s