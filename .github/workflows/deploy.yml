name: Deploy ML Model to GCP

on:
  push:
    branches:
      - deploy/prod

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fast tests only
        run: |
          pip install -r requirements.txt --quiet
          pip install pytest httpx pytest-asyncio --quiet
          pytest tests/test_api.py tests/test_cost_matrix.py -v --tb=short -m "not slow"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/scania-predictive-ml-api:${{ github.sha }} \
            -t europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/scania-predictive-ml-api:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push --all-tags \
            europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/scania-predictive-ml-api

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy scania-predictive-ml-api \
            --quiet \
            --image=europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/scania-predictive-ml-api:${{ github.sha }} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=10 \
            --port=8080 \
            --allow-unauthenticated \
            --set-env-vars=GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCS_BUCKET=${{ secrets.GCS_BUCKET }},MODEL_VERSION=${{ secrets.MODEL_VERSION }},ACTIVE_MODEL=${{ secrets.ACTIVE_MODEL }}

      - name: Allow public access to Cloud Run
        run: |
          gcloud beta run services add-iam-policy-binding scania-predictive-ml-api \
            --quiet \
            --region=${{ secrets.GCP_REGION }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Get Cloud Run URL and smoke test
        run: |
          URL=$(gcloud run services describe scania-predictive-ml-api \
            --quiet \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)")
          echo "✅ API live at: $URL"
          echo "📖 Docs at: $URL/docs"
          sleep 10
          curl -f $URL/health
          echo "✅ Health check passed"
